version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: quan_ly_quan_an_db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: quan_ly_quan_an
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
